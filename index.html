<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ameryth's Guide (MKP) - Complete Hacker Curriculum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(0, 230, 118, 0.5), 0 0 20px rgba(0, 188, 212, 0.3); }
            50% { text-shadow: 0 0 20px rgba(0, 230, 118, 0.8), 0 0 30px rgba(0, 188, 212, 0.6); }
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 230, 118, 0.3), inset 0 0 5px rgba(0, 230, 118, 0.1); }
            50% { box-shadow: 0 0 15px rgba(0, 230, 118, 0.6), inset 0 0 10px rgba(0, 230, 118, 0.2); }
        }
        
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 15px rgba(0, 230, 118, 0.7); }
            20%, 24%, 55% { text-shadow: none; }
        }
        
        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }
        
        :root {
            --bg: #000814;
            --surface: #0a1428;
            --surface2: #0d1b2a;
            --surface3: #1a2332;
            --text: #00ff00;
            --text2: #00cc00;
            --accent: #00ff00;
            --accent2: #00ffff;
            --accent3: #ff0080;
            --accent4: #ffff00;
            --border: #00ff00;
            --radius: 3px;
            --transition: 0.3s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #000814 0%, #0a1428 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Space Mono', 'Courier New', monospace;
            display: flex;
            min-height: 100vh;
            position: relative;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.02),
                    rgba(0, 255, 0, 0.02) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            animation: scanlines 8s linear infinite;
            z-index: 999;
        }
        
        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0a1428 0%, #0d1b2a 100%);
            border-right: 2px solid var(--accent);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            z-index: 10;
        }
        
        .sidebar .logo {
            font-weight: 900;
            font-size: 1.4rem;
            padding: 0 20px 20px;
            color: #fff;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            animation: glow 2s ease-in-out infinite;
        }
        
        .sidebar .logo span {
            color: var(--accent);
            animation: flicker 3s ease-in-out infinite;
        }
        
        .sidebar nav {
            flex: 1;
        }
        
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--text2);
            text-decoration: none;
            font-weight: 600;
            border-left: 3px solid transparent;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }
        
        .sidebar nav a::before {
            content: '> ';
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .sidebar nav a:hover::before,
        .sidebar nav a.active::before {
            opacity: 1;
        }
        
        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(0, 255, 0, 0.1);
            color: var(--accent);
            border-left-color: var(--accent);
            box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.2);
            padding-left: 25px;
        }
        
        .sidebar .lang-toggle {
            margin: 10px 20px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.1), rgba(0, 255, 0, 0.05));
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            color: var(--accent);
            cursor: pointer;
            text-align: center;
            font-weight: 700;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .sidebar .lang-toggle:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6), inset 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        /* MAIN */
        .main {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 2;
            max-height: 100vh;
        }
        
        .subject-section {
            display: none;
        }
        
        .subject-section.active {
            display: block;
        }
        
        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite;
        }
        
        .subtitle {
            color: var(--text2);
            margin-bottom: 24px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        
        .card {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.9), rgba(26, 35, 50, 0.9));
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2), inset 0 0 10px rgba(0, 255, 0, 0.05);
            transition: all 0.3s;
        }
        
        .card:hover {
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 255, 0, 0.1);
            border-color: var(--accent2);
        }
        
        .card h2 {
            color: var(--accent2);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .card ul, .card ol {
            margin-left: 20px;
        }
        
        .card li {
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        
        .curriculum-level {
            margin: 20px 0;
            padding: 15px;
            border-left: 3px solid var(--accent2);
            background: rgba(0, 255, 0, 0.05);
        }
        
        .curriculum-level h3 {
            color: var(--accent2);
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .lesson-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .lesson-item {
            background: linear-gradient(135deg, rgba(13, 27, 42, 0.8), rgba(26, 35, 50, 0.8));
            border-radius: var(--radius);
            padding: 18px;
            cursor: pointer;
            border: 2px solid rgba(0, 255, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
        }
        
        .lesson-item::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 255, 0, 0.1), transparent 70%);
            transform: rotate(45deg);
            animation: slide 3s infinite;
        }
        
        @keyframes slide {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .lesson-item:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.15), rgba(0, 188, 212, 0.1));
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.2);
            transform: scale(1.05);
        }
        
        .lesson-item .lesson-title {
            font-weight: 700;
            color: var(--accent);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .lesson-item .lesson-desc {
            color: var(--text2);
            font-size: 0.8rem;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }
        
        .detail-panel {
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.95), rgba(13, 27, 42, 0.95));
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 16px;
            display: none;
            border-left: 4px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1);
        }
        
        .detail-panel.open {
            display: block;
        }
        
        pre {
            background: #000814;
            color: var(--accent);
            padding: 15px;
            border-radius: var(--radius);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            border: 1px solid var(--accent);
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }
        
        .badge {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.8), rgba(255, 0, 100, 0.6));
            color: #fff;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }
        
        .ref-link {
            color: var(--accent2);
            text-decoration: none;
            border-bottom: 2px solid var(--accent2);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .ref-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .exercise-box {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.1), rgba(255, 255, 0, 0.05));
            padding: 15px;
            border-radius: var(--radius);
            margin: 12px 0;
            border: 1px solid rgba(255, 0, 128, 0.3);
        }
        
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px;
                border-right: none;
                border-bottom: 2px solid var(--accent);
            }
            .sidebar nav {
                display: flex;
                flex-wrap: wrap;
                width: 100%;
            }
            .sidebar nav a {
                padding: 8px 12px;
                flex: 1;
                min-width: 150px;
                text-align: center;
            }
            .main {
                padding: 16px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

        // Render main content based on active subject
        function renderContent(subject) {
            const main = document.getElementById('mainContent');
            const t = langData[currentLang];
            let html = '';

            if (subject === 'roadmap') {
                html = `<h1>${t.roadmapTitle}</h1><p class="subtitle">${t.roadmapDesc}</p>`;
                const steps = subjects.roadmap[currentLang].steps;
                html += '<div class="card"><ol>';
                steps.forEach((s, i) => html += `<li style="margin:8px 0;"><strong>${s}</strong></li>`);
                html += '</ol></div>';
            } else if (subject === 'programming') {
                html = `<h1>${t.programmingTitle}</h1><p class="subtitle">${subjects.programming[currentLang].desc}</p>`;
                const data = curriculum.programming[currentLang];
                for (let lang in data) {
                    if (lang === 'ref' || lang === 'exercise') continue;
                    const course = data[lang];
                    html += `<div class="card"><h2>${course.title}</h2>`;
                    for (let level in course.levels) {
                        let levelLabel = t['level' + level.charAt(0).toUpperCase() + level.slice(1)] || level;
                        html += `<div class="curriculum-level"><h3>${levelLabel}</h3><ul>`;
                        course.levels[level].forEach(item => html += `<li>${item}</li>`);
                        html += `</ul></div>`;
                    }
                    html += `<p><span class="badge">📚 ${t.reference}</span> <a class="ref-link" href="${course.ref}" target="_blank">${course.ref}</a></p>`;
                    html += `<p><span class="badge">⚡ ${t.practice}</span> ${course.exercise}</p></div>`;
                }
            } else if (subject === 'linux') {
                html = `<h1>${t.linuxTitle}</h1><p class="subtitle">${subjects.linux[currentLang].desc}</p>`;
                const data = curriculum.linux[currentLang];
                html += `<div class="card"><h2>Linux Curriculum</h2>`;
                for (let level in data.levels) {
                    let levelLabel = t['level' + level.charAt(0).toUpperCase() + level.slice(1)] || level;
                    html += `<div class="curriculum-level"><h3>${levelLabel}</h3><ul>`;
                    data.levels[level].forEach(item => html += `<li>${item}</li>`);
                    html += `</ul></div>`;
                }
                html += `<p><span class="badge">📚 ${t.reference}</span> <a class="ref-link" href="${data.ref}" target="_blank">${data.ref}</a></p>`;
                html += `<p><span class="badge">⚡ ${t.practice}</span> ${data.exercise}</p></div>`;
            } else if (subject === 'networking') {
                html = `<h1>${t.networkingTitle}</h1><p class="subtitle">${subjects.networking[currentLang].desc}</p>`;
                const data = curriculum.networking[currentLang];
                html += `<div class="card"><h2>Networking Curriculum</h2>`;
                for (let level in data.levels) {
                    let levelLabel = t['level' + level.charAt(0).toUpperCase() + level.slice(1)] || level;
                    html += `<div class="curriculum-level"><h3>${levelLabel}</h3><ul>`;
                    data.levels[level].forEach(item => html += `<li>${item}</li>`);
                    html += `</ul></div>`;
                }
                html += `<p><span class="badge">📚 ${t.reference}</span> <a class="ref-link" href="${data.ref}" target="_blank">${data.ref}</a></p>`;
                html += `<p><span class="badge">⚡ ${t.practice}</span> ${data.exercise}</p></div>`;
            } else if (subject === 'security') {
                html = `<h1>${t.securityTitle}</h1><p class="subtitle">${subjects.security[currentLang].desc}</p>`;
                const data = curriculum.security[currentLang];
                html += `<div class="card"><h2>Penetration Testing Phases</h2><ul>`;
                data.phases.forEach(p => html += `<li>${p}</li>`);
                html += `</ul></div>`;
                html += `<div class="card"><h2>Web Security</h2><ul>`;
                data.web.forEach(w => html += `<li>${w}</li>`);
                html += `</ul></div>`;
                html += `<div class="card"><h2>Network & Wireless</h2><ul>`;
                data.network.forEach(n => html += `<li>${n}</li>`);
                html += `</ul></div>`;
                html += `<p><span class="badge">📚 ${t.reference}</span> <a class="ref-link" href="${data.ref}" target="_blank">${data.ref}</a></p>`;
                html += `<p><span class="badge">⚡ ${t.practice}</span> ${data.exercise}</p></div>`;
            } else if (subject === 'logic') {
                html = `<h1>${t.logicTitle}</h1><p class="subtitle">${subjects.logic[currentLang].desc}</p>`;
                const data = curriculum.logic[currentLang];
                html += `<div class="card"><h2>Topics</h2><ul>`;
                data.topics.forEach(tp => html += `<li>${tp}</li>`);
                html += `</ul></div>`;
                html += `<p><span class="badge">📚 ${t.reference}</span> <a class="ref-link" href="${data.ref}" target="_blank">${data.ref}</a></p>`;
                html += `<p><span class="badge">⚡ ${t.practice}</span> ${data.exercise}</p></div>`;
            } else if (subject === 'tools') {
                html = `<h1>${t.toolsTitle}</h1><p class="subtitle">${subjects.tools[currentLang].desc}</p>`;
                const data = curriculum.tools[currentLang];
                html += `<div class="card"><h2>Practice Platforms</h2><ul>`;
                data.platforms.forEach(p => html += `<li>${p}</li>`);
                html += `</ul></div>`;
                html += `<div class="card"><h2>Essential Tools</h2><ul>`;
                data.tools.forEach(tool => html += `<li>${tool}</li>`);
                html += `</ul></div></div>`;
            }
            main.innerHTML = html;
        }

        // Language toggle
        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'my' ? 'en' : 'my';
            document.getElementById('langToggle').textContent = currentLang === 'my' ? '🌐 English / မြန်မာ' : '🌐 မြန်မာ / English';
            document.documentElement.lang = currentLang;
            const activeSubject = document.querySelector('#subjectNav a.active')?.dataset.subject || 'roadmap';
            renderContent(activeSubject);
        });

        // Subject navigation
        document.querySelectorAll('#subjectNav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('#subjectNav a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
                const subject = link.dataset.subject;
                renderContent(subject);
            });
        });

        // Initial render
        renderContent('roadmap');
    </script>
